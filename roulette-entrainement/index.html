<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Roulette d'entraînement</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --card:#1b2230; --line:#2a3446;
    --txt:#e8edf5; --muted:#93a1b5; --accent:#ff5a5f; --accent2:#4f8cff;
    --gold:#ffd166; --green:#3ddc84; --shadow:0 18px 50px rgba(0,0,0,.45);
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 15% -10%,#1a2740 0%,var(--bg) 55%) fixed;
    color:var(--txt); min-height:100%; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:26px 18px 60px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .logo{width:44px;height:44px;border-radius:12px;background:conic-gradient(from 0deg,var(--accent),#ff9a5f,var(--gold),var(--green),var(--accent2),var(--accent));box-shadow:var(--shadow)}
  h1{font-size:1.5rem;margin:0;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:.9rem;margin-top:2px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px;align-items:start}
  @media (max-width:880px){.grid{grid-template-columns:1fr}}

  /* Wheel */
  .stage{position:relative;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(180deg,var(--bg2),#12161f);border:1px solid var(--line);
    border-radius:var(--radius);padding:26px 18px 30px;box-shadow:var(--shadow)}
  .wheelBox{position:relative;width:min(74vw,420px);aspect-ratio:1/1}
  canvas{width:100%;height:100%;display:block;border-radius:50%;
    box-shadow:0 0 0 10px #0b0f16,0 0 0 12px #2a3446,0 22px 45px rgba(0,0,0,.5)}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:5;
    width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;
    border-top:30px solid var(--gold);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
  .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;
    width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c9d3e0 40%,#8b97a8);
    border:4px solid #0b0f16;display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;box-shadow:0 8px 18px rgba(0,0,0,.5);transition:transform .12s}
  .hub:active{transform:translate(-50%,-50%) scale(.94)}
  .hub span{font-weight:800;color:#12161f;font-size:.82rem;letter-spacing:.5px}
  .spinBtn{margin-top:22px;border:0;cursor:pointer;color:#fff;font-weight:800;font-size:1.05rem;
    padding:15px 40px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#ff8a5f);
    box-shadow:0 10px 24px rgba(255,90,95,.35);transition:transform .1s,filter .2s;letter-spacing:.3px}
  .spinBtn:hover{filter:brightness(1.07)}
  .spinBtn:active{transform:translateY(2px)}
  .spinBtn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.4)}

  /* Panel */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow)}
  .panel h2{font-size:.8rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 0 12px}
  .row{display:flex;gap:8px;margin-bottom:8px}
  input[type=text],select{flex:1;background:#0f141d;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:11px 12px;font-size:.95rem;outline:none;min-width:0}
  input[type=text]:focus,select:focus{border-color:var(--accent2)}
  .btn{border:1px solid var(--line);background:#0f141d;color:var(--txt);border-radius:10px;
    padding:0 14px;cursor:pointer;font-weight:600;transition:.15s}
  .btn:hover{border-color:var(--accent2);color:#fff}
  .btn.small{padding:7px 10px;font-size:.85rem}
  ul.items{list-style:none;margin:8px 0 0;padding:0;max-height:280px;overflow:auto}
  ul.items li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;
    background:#0f141d;margin-bottom:7px;border:1px solid transparent}
  ul.items li .dot{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
  ul.items li .name{flex:1;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ul.items li .x{cursor:pointer;color:var(--muted);font-weight:800;padding:2px 6px;border-radius:6px}
  ul.items li .x:hover{color:#fff;background:var(--accent)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{cursor:pointer;font-size:.82rem;padding:7px 11px;border-radius:999px;border:1px solid var(--line);
    background:#0f141d;color:var(--muted)}
  .chip:hover{color:#fff;border-color:var(--accent2)}
  .opts{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
  .opts label{display:flex;align-items:center;gap:7px;cursor:pointer}
  .timerBox{margin-top:16px;text-align:center}
  .timerDisplay{font-variant-numeric:tabular-nums;font-size:3rem;font-weight:800;letter-spacing:1px}
  .timerDisplay.run{color:var(--green)}
  .hist{margin-top:22px}
  .hist ol{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:.9rem;max-height:150px;overflow:auto}

  /* Result modal */
  .overlay{position:fixed;inset:0;background:rgba(5,8,13,.72);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.show{display:flex}
  .result{background:linear-gradient(180deg,var(--card),#12161f);border:1px solid var(--line);
    border-radius:20px;padding:34px 30px;text-align:center;max-width:420px;width:100%;
    box-shadow:var(--shadow);animation:pop .3s ease}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .result .k{color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-size:.75rem}
  .result .big{font-size:1.9rem;font-weight:800;margin:12px 0 20px;line-height:1.2}
  .result .swatch{width:54px;height:8px;border-radius:6px;margin:0 auto 14px}
  .result .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  footer{color:var(--muted);text-align:center;font-size:.8rem;margin-top:36px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"></div>
    <div>
      <h1>Roulette d'entraînement</h1>
      <div class="sub">Fais tourner la roue et laisse le hasard choisir ton exercice.</div>
    </div>
  </header>

  <div class="grid">
    <!-- Wheel -->
    <section class="stage">
      <div class="wheelBox">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
        <div class="hub" id="hub" title="Tourner"><span>SPIN</span></div>
      </div>
      <button class="spinBtn" id="spin">🎯 Faire tourner</button>

      <div class="timerBox" id="timerBox" style="display:none">
        <div class="timerDisplay" id="timerDisplay">00:00</div>
        <div class="tools" style="justify-content:center">
          <button class="btn small" id="tStart">▶︎ Démarrer</button>
          <button class="btn small" id="tReset">⟲ Réinitialiser</button>
        </div>
      </div>
    </section>

    <!-- Panel -->
    <aside>
      <div class="panel">
        <h2>Exercices sur la roue</h2>
        <div class="row">
          <input type="text" id="newItem" placeholder="Ajouter un exercice…" maxlength="40" />
          <button class="btn" id="addBtn">Ajouter</button>
        </div>
        <ul class="items" id="list"></ul>

        <div class="presets" id="presets"></div>

        <div class="opts">
          <label><input type="checkbox" id="optRemove" /> Retirer après tirage</label>
          <label><input type="checkbox" id="optSound" checked /> Son</label>
        </div>

        <div class="opts">
          <label><input type="checkbox" id="optTimer" /> Minuteur</label>
          <select id="timerSel" style="max-width:150px">
            <option value="20">20 sec</option>
            <option value="30" selected>30 sec</option>
            <option value="45">45 sec</option>
            <option value="60">1 min</option>
            <option value="90">1 min 30</option>
            <option value="120">2 min</option>
          </select>
        </div>

        <div class="tools">
          <button class="btn small" id="clearBtn">Tout effacer</button>
          <button class="btn small" id="shuffleBtn">Mélanger</button>
        </div>

        <div class="hist">
          <h2>Historique</h2>
          <ol id="history"></ol>
        </div>
      </div>
    </aside>
  </div>

  <footer>Fait tourner, entraîne-toi, recommence. 💪</footer>
</div>

<!-- Result modal -->
<div class="overlay" id="overlay">
  <div class="result">
    <div class="k">C'est parti !</div>
    <div class="swatch" id="rSwatch"></div>
    <div class="big" id="rText">—</div>
    <div class="actions">
      <button class="spinBtn" id="rGo" style="margin-top:0;padding:12px 26px">C'est parti</button>
      <button class="btn" id="rAgain">Retourner</button>
    </div>
  </div>
</div>

<script>
(() => {
  const COLORS = ["#ff5a5f","#4f8cff","#3ddc84","#ffd166","#a97bff","#ff9a5f","#2ec5c5","#f76ea6","#7ed957","#ffb703"];
  const PRESETS = {
    "Musculation": ["Pompes","Squats","Gainage","Fentes","Burpees","Abdos","Mountain climbers","Jumping jacks"],
    "Cardio": ["Sprint 30s","Corde à sauter","Montées de genoux","Talons-fesses","Shadow boxing","Skater jumps"],
    "Étirements": ["Ischios","Quadriceps","Épaules","Dos","Nuque","Hanches"],
    "Langues": ["Vocabulaire","Conjugaison","Compréhension orale","Lecture","Expression écrite","Prononciation"],
    "Musique": ["Gammes","Arpèges","Rythme","Improvisation","Déchiffrage","Un morceau au hasard"]
  };

  const $ = id => document.getElementById(id);
  const canvas = $("wheel"), ctx = canvas.getContext("2d");
  const R = canvas.width/2;

  let items = load("roulette.items") || PRESETS["Musculation"].slice();
  let history = load("roulette.history") || [];
  let angle = 0, spinning = false;
  let timerId = null, timerLeft = 0, timerRunning = false;

  /* ---------- persistence ---------- */
  function save(){ localStorage.setItem("roulette.items", JSON.stringify(items));
                   localStorage.setItem("roulette.history", JSON.stringify(history.slice(0,30))); }
  function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }

  /* ---------- wheel drawing ---------- */
  function colorAt(i){ return COLORS[i % COLORS.length]; }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const n = items.length;
    if(n === 0){
      ctx.fillStyle = "#1b2230"; ctx.beginPath(); ctx.arc(R,R,R-4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#93a1b5"; ctx.font = "24px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("Ajoute des exercices", R, R);
      return;
    }
    const arc = (Math.PI*2)/n;
    for(let i=0;i<n;i++){
      const start = angle + i*arc;
      ctx.beginPath(); ctx.moveTo(R,R);
      ctx.arc(R,R,R-4,start,start+arc); ctx.closePath();
      ctx.fillStyle = colorAt(i); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = 2; ctx.stroke();
      // label
      ctx.save();
      ctx.translate(R,R); ctx.rotate(start+arc/2);
      ctx.textAlign="right"; ctx.textBaseline="middle";
      ctx.fillStyle = "#0d1117"; ctx.font = `700 ${fontSize(n)}px sans-serif`;
      ctx.fillText(trim(items[i], n), R-24, 0);
      ctx.restore();
    }
    // inner ring
    ctx.beginPath(); ctx.arc(R,R,R-4,0,Math.PI*2);
    ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth=6; ctx.stroke();
  }
  function fontSize(n){ return n>14?15 : n>10?18 : n>6?22 : 26; }
  function trim(t,n){ const max = n>12?12 : n>8?16 : 22; return t.length>max ? t.slice(0,max-1)+"…" : t; }

  /* ---------- spinning ---------- */
  function spin(){
    if(spinning || items.length === 0) return;
    spinning = true; $("spin").disabled = true;
    const n = items.length, arc = (Math.PI*2)/n;
    const target = Math.floor(Math.random()*n);
    const turns = 5 + Math.random()*3;                 // 5–8 tours complets
    // pointer is at top (-PI/2). We want the middle of target segment under pointer.
    const pointerAngle = -Math.PI/2;
    const desired = pointerAngle - (target*arc + arc/2);
    const startAngle = angle;
    const finalAngle = desired - turns*Math.PI*2;      // negative => spins clockwise visually
    const total = turns*Math.PI*2 + ((startAngle-finalAngle)%(Math.PI*2));
    const dur = 4200 + Math.random()*800;
    let t0 = null, lastTick = -1;

    function frame(ts){
      if(t0===null) t0 = ts;
      const p = Math.min(1,(ts-t0)/dur);
      const eased = 1 - Math.pow(1-p, 3);              // easeOutCubic
      angle = startAngle + (finalAngle-startAngle)*eased;
      draw();
      // tick sound when crossing segment boundaries
      const idx = Math.floor(((-(angle)-Math.PI/2)/arc));
      if($("optSound").checked && idx !== lastTick){ lastTick = idx; tick(); }
      if(p<1){ requestAnimationFrame(frame); }
      else { spinning=false; $("spin").disabled=false; finish(target); }
    }
    requestAnimationFrame(frame);
  }

  function finish(i){
    const chosen = items[i];
    ding();
    history.unshift(chosen); renderHistory();
    $("rText").textContent = chosen;
    $("rSwatch").style.background = colorAt(i);
    $("overlay").classList.add("show");
    if($("optRemove").checked){
      items.splice(i,1); save(); renderList(); draw();
    }
  }

  /* ---------- sound (WebAudio) ---------- */
  let actx=null;
  function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function tick(){ const a=ac(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type="square"; o.frequency.value=900; g.gain.value=.04;
    o.connect(g); g.connect(a.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime+.05); o.stop(a.currentTime+.05);
  }
  function ding(){ if(!$("optSound").checked) return; const a=ac(); if(!a) return;
    [660,880,1100].forEach((f,k)=>{ const o=a.createOscillator(), g=a.createGain();
      o.type="sine"; o.frequency.value=f; g.gain.value=.0001;
      o.connect(g); g.connect(a.destination); const t=a.currentTime+k*.09;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.start(t); o.stop(t+.32); });
  }

  /* ---------- list rendering ---------- */
  function renderList(){
    const ul = $("list"); ul.innerHTML="";
    items.forEach((it,i)=>{
      const li=document.createElement("li");
      const dot=document.createElement("span"); dot.className="dot"; dot.style.background=colorAt(i);
      const name=document.createElement("span"); name.className="name"; name.textContent=it; name.title=it;
      const x=document.createElement("span"); x.className="x"; x.textContent="×"; x.title="Retirer";
      x.onclick=()=>{ items.splice(i,1); save(); renderList(); draw(); };
      li.append(dot,name,x); ul.appendChild(li);
    });
  }
  function renderHistory(){
    const ol=$("history"); ol.innerHTML="";
    history.slice(0,12).forEach(h=>{ const li=document.createElement("li"); li.textContent=h; ol.appendChild(li); });
    save();
  }
  function renderPresets(){
    const box=$("presets");
    Object.keys(PRESETS).forEach(name=>{
      const c=document.createElement("span"); c.className="chip"; c.textContent=name;
      c.onclick=()=>{ items = PRESETS[name].slice(); save(); renderList(); draw(); };
      box.appendChild(c);
    });
  }

  /* ---------- timer ---------- */
  function fmt(s){ const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0"); }
  function timerReset(){ timerRunning=false; clearInterval(timerId);
    timerLeft = parseInt($("timerSel").value,10);
    $("timerDisplay").textContent = fmt(timerLeft);
    $("timerDisplay").classList.remove("run"); $("tStart").textContent="▶︎ Démarrer";
  }
  function timerToggle(){
    if(timerRunning){ timerRunning=false; clearInterval(timerId);
      $("tStart").textContent="▶︎ Reprendre"; $("timerDisplay").classList.remove("run"); return; }
    timerRunning=true; $("tStart").textContent="⏸ Pause"; $("timerDisplay").classList.add("run");
    timerId=setInterval(()=>{
      timerLeft--; $("timerDisplay").textContent=fmt(Math.max(0,timerLeft));
      if(timerLeft<=0){ clearInterval(timerId); timerRunning=false; ding();
        $("timerDisplay").classList.remove("run"); $("tStart").textContent="▶︎ Démarrer"; }
    },1000);
  }

  /* ---------- events ---------- */
  function addItem(){
    const v=$("newItem").value.trim();
    if(!v) return;
    if(items.length>=24){ alert("Maximum 24 exercices sur la roue."); return; }
    items.push(v); $("newItem").value=""; save(); renderList(); draw();
  }
  $("addBtn").onclick=addItem;
  $("newItem").addEventListener("keydown",e=>{ if(e.key==="Enter") addItem(); });
  $("spin").onclick=()=>{ ac(); spin(); };
  $("hub").onclick=()=>{ ac(); spin(); };
  $("clearBtn").onclick=()=>{ if(confirm("Vider la roue ?")){ items=[]; save(); renderList(); draw(); } };
  $("shuffleBtn").onclick=()=>{ for(let i=items.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [items[i],items[j]]=[items[j],items[i]]; } save(); renderList(); draw(); };
  $("rGo").onclick=()=>{ $("overlay").classList.remove("show");
    if($("optTimer").checked){ timerReset(); timerToggle(); } };
  $("rAgain").onclick=()=>{ $("overlay").classList.remove("show"); spin(); };
  $("overlay").addEventListener("click",e=>{ if(e.target===$("overlay")) $("overlay").classList.remove("show"); });

  $("optTimer").addEventListener("change",e=>{
    $("timerBox").style.display = e.target.checked ? "block":"none";
    if(e.target.checked) timerReset();
  });
  $("timerSel").addEventListener("change",timerReset);
  $("tStart").onclick=timerToggle;
  $("tReset").onclick=timerReset;

  /* ---------- init ---------- */
  renderPresets(); renderList(); renderHistory(); draw();
})();
</script>
</body>
</html>
