<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#fff1e2"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="45%" stop-color="#f5b14c"/>
      <stop offset="100%" stop-color="#ef7d5a"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d98a1e"/>
      <stop offset="100%" stop-color="#d8491f"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d98a1e"/>
      <stop offset="100%" stop-color="#d8491f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- grand soleil avec rayons -->
  <g transform="translate(960,150)">
    <g stroke="#f5b14c" stroke-width="7" stroke-linecap="round" opacity="0.8">
      <line x1="0" y1="-150" x2="0" y2="-108"/>
      <line x1="0" y1="150" x2="0" y2="108"/>
      <line x1="-150" y1="0" x2="-108" y2="0"/>
      <line x1="150" y1="0" x2="108" y2="0"/>
      <line x1="-106" y1="-106" x2="-76" y2="-76"/>
      <line x1="106" y1="106" x2="76" y2="76"/>
      <line x1="106" y1="-106" x2="76" y2="-76"/>
      <line x1="-106" y1="106" x2="-76" y2="76"/>
    </g>
    <circle cx="0" cy="0" r="95" fill="url(#sun)"/>
  </g>

  <g transform="translate(90,232)">
    <circle cx="26" cy="20" r="26" fill="url(#sun)"/>
    <text x="70" y="36" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#3a2318">Solarijia</text>
  </g>
  <text x="92" y="348" font-family="Georgia, serif" font-size="80" font-weight="700" fill="#3a2318">Révélez votre</text>
  <text x="92" y="432" font-family="Georgia, serif" font-size="80" font-weight="700" fill="url(#word)">éclat</text>
  <text x="96" y="488" font-family="Inter, Arial, sans-serif" font-size="29" fill="#6e4a37">Institut de beauté · soins visage, corps, regard &amp; plus</text>
  <g transform="translate(96,520)">
    <rect width="318" height="66" rx="33" fill="url(#cta)"/>
    <text x="159" y="43" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Prendre rendez-vous</text>
  </g>
</svg>
