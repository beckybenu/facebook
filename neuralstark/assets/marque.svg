<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Neural Stark">
  <!-- Marque Neural Stark, version pleine : sphère sombre, lisière éclairée en
       haut à droite, traînée qui la traverse et ressort en flare. -->
  <defs>
    <radialGradient id="m-sphere" cx="70%" cy="26%" r="84%">
      <stop offset="0" stop-color="#4a3a92"/>
      <stop offset="46%" stop-color="#170f33"/>
      <stop offset="100%" stop-color="#06040f"/>
    </radialGradient>
    <linearGradient id="m-trainee" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6a4ce8" stop-opacity="0"/>
      <stop offset="18%" stop-color="#7b5cf0" stop-opacity=".55"/>
      <stop offset="52%" stop-color="#c9b6ff"/>
      <stop offset="100%" stop-color="#f6eeff"/>
    </linearGradient>
    <radialGradient id="m-flare">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#e9c9fc" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#472fc2" stop-opacity="0"/>
    </radialGradient>
    <filter id="m-flou" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="118" fill="#472fc2" opacity=".22" filter="url(#m-flou)"/>
  <circle cx="160" cy="160" r="106" fill="url(#m-sphere)"/>
  <path d="M160 54a106 106 0 0 1 98.9 67.6" fill="none" stroke="#a78bfa" stroke-width="5"
        stroke-linecap="round" opacity=".75"/>
  <path d="M34 238C90 218 152 178 288 74" fill="none" stroke="url(#m-trainee)" stroke-width="13"
        stroke-linecap="round" opacity=".35" filter="url(#m-flou)"/>
  <path d="M34 238C90 218 152 178 288 74" fill="none" stroke="url(#m-trainee)" stroke-width="5"
        stroke-linecap="round"/>
  <circle cx="266" cy="90" r="30" fill="url(#m-flare)"/>
  <circle cx="266" cy="90" r="5.5" fill="#fdf9ff"/>
</svg>
