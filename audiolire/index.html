<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AudioLire — vos livres lus à voix haute</title>
<meta name="description" content="Lecteur de livres audio dans le navigateur : importez un PDF, EPUB ou TXT, écoutez-le à voix haute, choisissez la voix et la vitesse. Position mémorisée automatiquement.">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <button class="brand" id="homeBtn" type="button">
    <span class="brand-mark">🎧</span>
    <span class="brand-name">AudioLire</span>
  </button>

  <div class="topbar-actions">
    <select id="uiLang" class="mini-select" aria-label="Langue de l'interface">
      <option value="fr">🇫🇷 Français</option>
      <option value="en">🇬🇧 English</option>
      <option value="es">🇪🇸 Español</option>
      <option value="de">🇩🇪 Deutsch</option>
    </select>
    <button class="btn btn-primary" id="importBtn" type="button">
      <span aria-hidden="true">📖</span>
      <span class="btn-label" data-i18n="import">Importer un livre</span>
    </button>
  </div>
</header>

<input type="file" id="fileInput" multiple hidden>

<!-- ============================ BIBLIOTHÈQUE ============================ -->
<main class="view" id="libraryView">
  <div class="dropzone" id="dropzone">
    <div class="dropzone-inner">
      <div class="dropzone-icon">📚</div>
      <h1 data-i18n="libTitle">Votre bibliothèque</h1>
      <p data-i18n="libHint">Glissez vos fichiers ici — PDF, EPUB, TXT, MD ou HTML. Tout reste sur votre appareil.</p>
      <button class="btn btn-primary" id="importBtn2" type="button" data-i18n="chooseFile">Choisir un fichier</button>
    </div>
  </div>

  <section class="shelf" id="shelf" hidden>
    <h2 data-i18n="myBooks">Mes livres</h2>
    <div class="grid" id="bookGrid"></div>
  </section>
</main>

<!-- ============================== LECTEUR ============================== -->
<main class="view reader" id="readerView" hidden>
  <div class="reader-head">
    <button class="icon-btn" id="backBtn" type="button" title="Bibliothèque" aria-label="Bibliothèque">←</button>
    <div class="reader-title">
      <strong id="bookTitle"></strong>
      <span id="bookMeta"></span>
    </div>
    <button class="icon-btn" id="searchBtn" type="button" title="Rechercher" aria-label="Rechercher">🔎</button>
    <button class="icon-btn" id="settingsBtn" type="button" title="Voix et vitesse" aria-label="Voix et vitesse">🔊</button>
  </div>

  <div class="pager" id="pager" hidden>
    <button class="btn btn-ghost" id="prevPage" type="button">←</button>
    <span id="pageLabel"></span>
    <button class="btn btn-ghost" id="nextPage" type="button">→</button>
  </div>

  <article class="text" id="textPane" tabindex="0"></article>

  <!-- Barre de lecture -->
  <div class="player">
    <input type="range" id="seekBar" class="seek" min="0" max="100" value="0" step="1" aria-label="Position dans le livre">
    <div class="player-row">
      <span class="time" id="posLabel">0 %</span>

      <div class="controls">
        <button class="icon-btn" id="back10" type="button" title="Reculer de 10 phrases" aria-label="Reculer de 10 phrases">⏪</button>
        <button class="icon-btn" id="back1" type="button" title="Phrase précédente" aria-label="Phrase précédente">⏮</button>
        <button class="icon-btn play" id="playBtn" type="button" title="Lire / Pause" aria-label="Lire">▶️</button>
        <button class="icon-btn" id="stopBtn" type="button" title="Arrêter" aria-label="Arrêter">⏹</button>
        <button class="icon-btn" id="fwd1" type="button" title="Phrase suivante" aria-label="Phrase suivante">⏭</button>
        <button class="icon-btn" id="fwd10" type="button" title="Avancer de 10 phrases" aria-label="Avancer de 10 phrases">⏩</button>
      </div>

      <span class="time" id="rateLabel">1.0×</span>
    </div>
  </div>
</main>

<!-- ============================== PANNEAUX ============================== -->
<aside class="panel" id="settingsPanel" hidden>
  <div class="panel-head">
    <h2 data-i18n="voiceSettings">Voix et vitesse</h2>
    <button class="icon-btn" data-close type="button" aria-label="Fermer">✕</button>
  </div>
  <div class="panel-body">
    <label class="field">
      <span data-i18n="bookLang">Langue du livre</span>
      <select id="langSelect"></select>
    </label>
    <label class="field">
      <span data-i18n="voice">Voix</span>
      <select id="voiceSelect"></select>
    </label>
    <p class="hint" id="voiceHint"></p>

    <label class="field">
      <span><span data-i18n="speed">Vitesse</span> <b id="rateOut">1.0×</b></span>
      <input type="range" id="rate" min="0.5" max="2.5" step="0.1" value="1">
    </label>
    <label class="field">
      <span><span data-i18n="pitch">Tonalité</span> <b id="pitchOut">1.0</b></span>
      <input type="range" id="pitch" min="0.5" max="1.5" step="0.1" value="1">
    </label>
    <label class="field">
      <span><span data-i18n="volume">Volume</span> <b id="volumeOut">100 %</b></span>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
    </label>

    <label class="check">
      <input type="checkbox" id="highlightWords" checked>
      <span data-i18n="highlightWords">Surligner les mots pendant la lecture</span>
    </label>
    <label class="check">
      <input type="checkbox" id="autoScroll" checked>
      <span data-i18n="autoScroll">Suivre le texte automatiquement</span>
    </label>
  </div>
</aside>

<aside class="panel" id="searchPanel" hidden>
  <div class="panel-head">
    <h2 data-i18n="search">Rechercher un passage</h2>
    <button class="icon-btn" data-close type="button" aria-label="Fermer">✕</button>
  </div>
  <div class="panel-body">
    <input type="search" id="searchInput" class="search-input" placeholder="Mot ou phrase…" data-i18n-ph="searchPh" autocomplete="off">
    <p class="hint" id="searchCount"></p>
    <div id="searchResults" class="results"></div>
  </div>
</aside>

<div class="scrim" id="scrim" hidden></div>

<div class="toast" id="toast" hidden></div>

<div class="loader" id="loader" hidden>
  <div class="loader-box">
    <div class="spinner"></div>
    <p id="loaderText">Import en cours…</p>
    <div class="bar"><div id="loaderBar"></div></div>
  </div>
</div>

<footer class="foot">
  <p data-i18n="footer">100 % local : vos livres ne quittent jamais votre navigateur. Synthèse vocale fournie par votre système.</p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
